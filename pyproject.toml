# Note that in maintenance branches, all build dependencies should
# have an upper bound equal to the most recent already-released version
# of the dependency. This to prevent that a future backwards-incompatible
# release will break the source build of a SciPy release.
# Do accept micro (bug-fix) releases. So for example, if pybind11 2.4.3 is
# the most recent version on PyPI:
#
#     "pybind11>=2.4.3,<2.5.0",
#
# Upper bounds in release branches must have notes on why they are added.
# Distro packages can ignore upper bounds added only to prevent future
# breakage; if we add pins or bounds because of known problems then they need
# them too.

# Run tools/generate_requirements.txt when making changes to any dependencies

[build-system]
build-backend = 'mesonpy'
# NOTE: when updating this table, also update `dependency-groups.build`
requires = [
    "meson-python>=0.15.0",
    "Cython>=3.2.0",        # when updating version, also update check in meson.build
    "pybind11>=2.13.2",     # when updating version, also update check in scipy/meson.build
    "pythran>=0.18.1",      # when updating version, also update check in meson.build
    "numpy>=2.0.0",
]

[project]
name = "scipy"
version = "2.0.0.dev0"
# TODO: add `license-files` once PEP 639 is accepted (see meson-python#88)
#       at that point, no longer include them in `py3.install_sources()`
license = { file = "LICENSE.txt" }
description = "Fundamental algorithms for scientific computing in Python"
maintainers = [
    { name = "SciPy Developers", email = "scipy@discuss.scientific-python.org" },
]
# Note: Python and NumPy upper version bounds should be set correctly in
# release branches, see:
#     https://scipy.github.io/devdocs/dev/core-dev/index.html#version-ranges-for-numpy-and-other-dependencies
requires-python = ">=3.12"  # keep in sync with `min_python_version` in meson.build
dependencies = [
    "numpy>=2.0.0",
] # keep in sync with `min_numpy_version` in meson.build
readme = "README.rst"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: C",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
]

[project.urls]
homepage = "https://scipy.org/"
documentation = "https://docs.scipy.org/doc/scipy/"
source = "https://github.com/scipy/scipy"
download = "https://pypi.org/project/scipy/"
install = "https://scipy.org/install/"
releasenotes = "https://docs.scipy.org/doc/scipy/release.html"
tracker = "https://github.com/scipy/scipy/issues"
developer-discussion = "https://discuss.scientific-python.org/c/contributor/scipy/"
user-discussion = "https://discuss.scientific-python.org/c/user/scipy/"

# NOTE: when updating this table, also update `dependency-groups.optional-runtime-deps`
[project.optional-dependencies]
all = [
    "pooch",  # datasets
    "threadpoolctl",  # io.mm{...}
    "matplotlib",  # cluster.hierarchy.dendrogram, stats.probplot
    # circular dependency issues, https://github.com/scipy/scipy/issues/19783
    # "scikit-umfpack",  # optimize, sparse.linalg
]

[dependency-groups]
optional-runtime-deps = [
    "pooch",  # datasets
    "threadpoolctl",  # io.mm{...}
    "matplotlib",  # cluster.hierarchy.dendrogram, stats.probplot
    # circular dependency issues, https://github.com/scipy/scipy/issues/19783
    # "scikit-umfpack",  # optimize, sparse.linalg
]

build = [
    "meson-python>=0.15.0",
    "Cython>=3.2.0",
    "pybind11>=2.13.2",
    "pythran>=0.18.1",
    "numpy>=2.0.0",
    "ninja>=1.8.2",
]

test-core = [
    "pytest>=8.0.0",
    "hypothesis>=6.30",
    "pooch",
    "pytest-xdist",  # not required, but used widely, belongs in -core
    "pytest-timeout",  # not required, but used widely, belongs in -core
]
test-mp = [
    "mpmath",
    # for PyPI: 'gmpy2; sys_platform != "win32" or platform_machine != "ARM64"'
    "gmpy2",
]
test-extending-cython = [  # {special, linalg, optimize}.tests.test_extending
    "Cython",
    "meson",
    'ninja; sys_platform != "emscripten"',
]
test-parallel = [
    { include-group = "test-core" },
    "pytest-run-parallel",
]
test-docs = [
    { include-group = "test-core" },
    "scipy-doctest>=2.0.0",
    "matplotlib",
]
test-array-types = [
    { include-group = "test-core" },
    "array-api-strict>=2.3.1",
    "marray",
    # for PyPI: 'sparse; sys_platform != "win32" or platform_machine != "ARM64"'
    "sparse",
]
test = [
    { include-group = "optional-runtime-deps" },
    { include-group = "test-core" },
    { include-group = "test-mp" },
    { include-group = "test-extending-cython" },
    { include-group = "test-parallel" },
    { include-group = "test-docs" },
    { include-group = "test-array-types" },
    # useful but doesn't have its own group (rarely used, and has compiled wheels so can be hard to install)
    "psutil",
]
test-fail-slow = [
    { include-group = "test-core" },
    "pytest-fail-slow",  # only one CI job; isolated so it doesn't cause failures for contributors randomly
]
coverage = [
    { include-group = "test" },  # includes all optional test and runtime deps for maximum coverage
    "pytest-cov",
]

bench = [
    # https://github.com/airspeed-velocity/asv/issues/1537
    "asv==0.6.4",
    "pyfftw",
    "cffi", 
]

doc = [
    "sphinx>=5.0.0,<8.2.0",
    "intersphinx_registry",
    "pydata-sphinx-theme>=0.15.2",
    "sphinx-copybutton",
    "sphinx-design>=0.4.0",
    "matplotlib>=3.5",
    "numpydoc",
    "jupytext",
    "myst-nb>=1.2.0",
    "pooch",
    "jupyterlite-sphinx>=0.19.1",
    "jupyterlite-pyodide-kernel",
    "linkify-it-py",
    "tabulate",
]

dev-cli = [
    "spin",
]

typecheck = [
    # type checkers
    "pyrefly==1.1.1",
    # typing deps
    "typing_extensions",
    # stub deps
    "types-cffi",
    "types-psutil",
    "types-pyyaml",
    # import deps
    "array_api_strict",
    "cython",
    "dask",
    "matplotlib",
    "pybind11",
    # circular dependency issues, https://github.com/scipy/scipy/issues/19783
    # "scikit-umfpack",
    "sphinx",
    "sympy",
    "uarray",
]

lint = [
    "ruff>=0.12.0",
    "cython-lint>=0.12.2",
    "packaging",
    "tach",
    "zizmor",
]

dev = [
    { include-group = "build" },
    { include-group = "test" },
    { include-group = "bench" },
    { include-group = "doc" },
    { include-group = "dev-cli" },
    { include-group = "typecheck" },
    { include-group = "lint" },
    "scipy-stubs",
]

[tool.spin]
package = 'scipy'

[tool.meson-python.args]
install = ['--skip-subprojects']

[tool.cibuildwheel]
skip = ["*_i686", "*_ppc64le", "*_s390x", "*_universal2"]
# We're only testing with essential test dependencies, not optional ones.
# Some of those require binary wheels (often missing for some platforms),
# or they slow down the test suite runs too much or simply aren't necessary.
test-requires = [
    "pytest",
    "pytest-xdist",
    "threadpoolctl",
    "pooch",
    "hypothesis",
]
before-build = "bash {project}/tools/wheels/cibw_before_build.sh {project}"
test-command = "bash {project}/tools/wheels/cibw_test_command.sh {project}"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
musllinux-x86_64-image = "musllinux_1_2"
musllinux-aarch64-image = "musllinux_1_2"

[tool.cibuildwheel.linux.environment]
# RUNNER_OS is a GitHub Actions specific env var; define it here so it's
# defined when running cibuildwheel locally
RUNNER_OS="Linux"
PKG_CONFIG_PATH = "/project/.openblas"

[tool.cibuildwheel.macos.environment]
PKG_CONFIG_PATH = "{project}"

[tool.cibuildwheel.windows]
repair-wheel-command = "bash ./tools/wheels/repair_windows.sh {wheel} {dest_dir}"

[tool.cibuildwheel.windows.environment]
# This does not work because pkg-config does not like backslashes,
PKG_CONFIG_PATH = "{project}"
# do this instead (which will override this setting)
# set CIBW_ENVIRONMENT_WINDOWS=PKG_CONFIG_PATH=PWD.replace('\\', '/')

[tool.cibuildwheel.pyodide]
# cibuildwheel 4.1.0 pins pyodide-build 0.35.0. Override to 0.36.0 to fix the
# cross-build NumPy meson dependency detection. TODO: drop this once it makes
# it to a released version of cibuildwheel
dependency-versions = "packages: pyodide-build==0.36.0"
before-build = "bash {project}/tools/wheels/cibw_before_build_pyodide.sh {project}"
repair-wheel-command = "pyodide auditwheel repair --libdir {project}/.blis/lib --output-dir {dest_dir} {wheel}"
test-requires = ["pytest", "pytest-reportlog", "hypothesis", "threadpoolctl", "pooch"]
# The single long-lived WASM interpreter intermittently corrupts its function
# table and hangs or traps (see gh-25713), so run the suite as many short
# invocations, each in a fresh interpreter. Small subpackages run whole and
# large ones are split into buckets of test modules. Every chunk runs under a
# hard timeout and is retried once in a fresh interpreter, so an intermittent
# runtime fault does not fail the job, while a genuine test failure still
# fails twice. Per-chunk pytest-reportlog files are combined at the end.
test-command = """
logdir="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/scipy-reportlogs" && mkdir -p "$logdir" && ret=0
# GNU timeout is absent on macOS hosts; degrade to running without a timeout.
command -v timeout >/dev/null 2>&1 || timeout() { shift; "$@"; }
echo "Writing per-chunk report logs to $logdir"
chunks=$(python - <<'GEN'
import pathlib
import pkgutil

import scipy

SPLIT = {"stats": 4, "special": 3, "sparse": 3, "linalg": 3, "optimize": 3,
         "signal": 2, "interpolate": 2, "ndimage": 2, "io": 2}
# Modules whose collection is coupled through import-time state must stay in
# the same chunk: test_discrete_basic mutates _distr_params.distdiscrete at
# import, and the parametrisations of test_fit and test_sampling read it.
# Within a chunk pytest collects the targets in sorted order, matching the
# full suite's alphabetical import order, so consumers that sort before the
# mutator (such as test_continuous) are safe in any bucket.
PIN = {"stats": [{"test_discrete_basic.py", "test_fit.py",
                  "test_sampling.py"}]}
root = pathlib.Path(scipy.__path__[0])
for _, sub, ispkg in sorted(pkgutil.iter_modules(scipy.__path__)):
    if not ispkg:
        continue
    n = SPLIT.get(sub)
    if not n:
        print(f"{sub}|scipy.{sub}")
        continue
    files = sorted(root.glob(f"{sub}/**/tests/test_*.py"))
    units = []
    pinned = set()
    for group in PIN.get(sub, []):
        unit = [f for f in files if f.name in group]
        if unit:
            units.append(unit)
            pinned.update(unit)
    units.extend([f] for f in files if f not in pinned)
    buckets = [[] for _ in range(n)]
    sizes = [0] * n
    for unit in sorted(units, key=lambda u: -sum(f.stat().st_size for f in u)):
        i = sizes.index(min(sizes))
        buckets[i].extend(unit)
        sizes[i] += sum(f.stat().st_size for f in unit)
    for i, bucket in enumerate(buckets):
        if bucket:
            mods = ",".join("scipy." + ".".join(f.relative_to(root).with_suffix("").parts)
                            for f in sorted(bucket))
            print(f"{sub}-{i + 1}|{mods}")
GEN
)
for chunk in $chunks; do
  name="${chunk%%|*}"
  targets=$(echo "${chunk#*|}" | tr ',' ' ')
  echo "::group::scipy chunk $name"
  attempt=1
  while true; do
    timeout 900 python -m pytest -vra --pyargs $targets -m 'not slow' --report-log="$logdir/$name.jsonl"
    rc=$?
    if [ "$rc" -eq 0 ] || [ "$rc" -eq 5 ] || [ "$attempt" -eq 2 ]; then break; fi
    echo "!! chunk $name exited $rc, retrying once in a fresh interpreter"
    attempt=2
  done
  echo "::endgroup::"
  if [ "$rc" -ne 0 ] && [ "$rc" -ne 5 ]; then ret=1; echo "!! chunk $name failed after retry (exit $rc)"; fi
done
cat "$logdir"/*.jsonl > "$logdir/full.jsonl" 2>/dev/null || true
# Guard: the chunks must cover exactly the tests a plain full-suite run
# would select. Compare the combined report log against a fresh collection.
expected=$(python -m pytest --collect-only -q -m 'not slow' --pyargs scipy 2>/dev/null | grep -c "::")
actual=$(python - "$logdir/full.jsonl" <<'CNT'
import json
import sys

ids = set()
with open(sys.argv[1]) as f:
    for line in f:
        report = json.loads(line)
        if report.get("$report_type") == "TestReport":
            ids.add(report["nodeid"])
print(len(ids))
CNT
)
echo "Coverage guard: ran $actual unique tests, full collection selects $expected"
if [ "$actual" != "$expected" ]; then echo "!! chunked run does not cover the full suite"; ret=1; fi
exit $ret
"""

[tool.cibuildwheel.pyodide.config-settings]
setup-args = ["-Dblas=blis", "-Dlapack=semicolon-lapack"]

[tool.cibuildwheel.pyodide.environment]
PKG_CONFIG_PATH = "$(pwd)/.blis/lib/pkgconfig:$(pwd)/.blis/share/pkgconfig"
# Stop Ninja from moving long link commands into a response file,
# which the pyodide-build pywasmcross wrapper does not read. See:
# https://github.com/pyodide/pyodide-build/issues/398
MESON_RSP_THRESHOLD = "131072"

[tool.spin.commands]
"Build & Develop" = [
  ".spin/cmds.py:build",
  ".spin/cmds.py:test",
  ".spin/cmds.py:lint",
  ".spin/cmds.py:check",
  "spin.cmds.pip.install"
]
"Environments" = [
  "spin.cmds.meson.run",
  ".spin/cmds.py:python",
  ".spin/cmds.py:ipython",
  ".spin/cmds.py:shell",
  "spin.cmds.meson.gdb",
  "spin.cmds.meson.lldb"
]
"Documentation" = [
  ".spin/cmds.py:docs",
  ".spin/cmds.py:smoke_docs",
  ".spin/cmds.py:refguide_check",
  ".spin/cmds.py:smoke_tutorials"
]
"Release" = [
  ".spin/cmds.py:notes",
  ".spin/cmds.py:authors"
]
"Metrics" = [".spin/cmds.py:bench"]
